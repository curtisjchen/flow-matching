training:
  epochs: 300
  loss_type: mean_flow
  batch_size: 256
  learning_rate: 3.0e-4
  min_lr: 1.0e-5
  warmup_epochs: 5
  p_rt: 0.5
  adaptive_loss_power: 1.0
  adaptive_loss_eps: 1.0e-2
  time_sampler: logit_normal
  logit_normal_mean: -0.4
  logit_normal_std: 1.0
  cfg_aware_loss: True

model:
  type: unet
  channels : [64, 296]
  prefinal: 32
  time_in: 128
  time_out: 256
  in_channels: 1
  w: 28
  h: 28
  image_size: 28
  w_min: 1.0
  w_max: 3.0
  p_uncond: 0.1
  num_classes: 10
