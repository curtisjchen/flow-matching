training:
  epochs: 300
  loss_type: flow_matching
  batch_size: 512
  learning_rate: 1.0e-4
  min_lr: 1.0e-4
  warmup_epochs: 5
  p_rt: 1.0
  adaptive_loss_power: 1.0
  adaptive_loss_eps: 1.0e-2
  time_sampler: logit_normal
  logit_normal_mean: -0.4
  logit_normal_std: 1.0
  cfg_aware_loss: False

model:
  type: unet
  dataset: cifar10
  channels : [64, 256, 512]
  prefinal: 32
  time_in: 128
  time_out: 256
  w_min: 1.0
  w_max: 3.0
  p_uncond: 0.1
  num_classes: 10
